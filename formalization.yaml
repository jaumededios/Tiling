    and rational-slopes library developments. Comparator coverage consists of one rational-polygonal periodicity
    theorem, thirteen axis-parallel geometric results, two axis-parallel computability results, and five
    rational-slopes results. Additional paper-facing library theorems are audited by Verification.lean.
    This does not assert that every statement in every source manuscript is formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
