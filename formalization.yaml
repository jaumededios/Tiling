  - Jaume de Dios Pont
  - Jan Grebík
  - Rachel Greenfeld
  - José Madrid
  id: arXiv:2408.02151v2
  type: paper
  relationship: formalizes
  location: Theorem 1.1, Corollary 1.1, Theorem 1.2
  note: Periodic tilings, decidability, and weak periodicity for rational polygonal sets.
- title: The structure of translational tilings in Z^d
  authors:
  - Rachel Greenfeld
  - Terence Tao
  id: arXiv:2010.03254v3
  type: paper
  relationship: formalizes
  note: Paper-facing declarations are exported by TranslationalTilings/Main.lean; this discrete theory
    supports the continuous tiling proofs.
- title: Translational tilings by axes-parallel polygonal sets
  type: supplied manuscript
  relationship: formalizes
  note: The thirteen geometry and two computational comparator targets state the public scope. The comparator
    documentation identifies the manuscript theorem numbers and formulation changes. No public manuscript
    URL is recorded.
- title: 'Tilings by polygonal sets with rational slopes I: Locally finite tilings and PTC'
  type: supplied manuscript
  relationship: formalizes
  id: Tiling_polygons-2/Main/main2_LocalFin.tex
  note: 'Source member SHA-256: 1cb10dc4f0e54e04eb9483717b316cee620bdaf68b273e11f0bea02a081b877c. This
    source archive is not bundled with the public repository.'
- title: 'Tilings by polygonal sets with rational slopes II: Minimal tilings of R^2 are weakly periodic'
  type: supplied manuscript
  relationship: formalizes
  id: Tiling_polygons-2/Main/main1_Earth.tex
  note: 'Source member SHA-256: 39e90b1bb5621abc3fe64d3e73e92153ff9f6323c06c40252321cfa4b2e3cea9. The
    rational-slopes comparator states the five public results across Parts I and II.'
