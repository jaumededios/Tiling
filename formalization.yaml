  notes: Jaume de Dios Pont directed the mathematical scope and iteratively reviewed the theorem statements
    and exposition. Agent review and kernel checking are distinguished from independent human peer review.
fidelity:
  divergences: Continuous tilings use countable centres and almost-everywhere packing and coverage. Periods
    and partitions of centres are exact. Rational polygonal sets are represented by finite triangulations,
    with null boundaries allowing open and closed representatives to be compared. Axis-parallel geometry
    uses intrinsic finite boundary segments; a proved bridge supplies finite rectangle presentations.
    The computational interface uses finite rectangle families and a uniform algorithm querying signs
    of integer combinations of corner coordinates. Different quasiperiodic pieces may have different lattices.
    Exact carrier, regular-openness, FLC, and minimality hypotheses are stated in the challenges; paper-to-Lean
    differences are explained beside the statements.
