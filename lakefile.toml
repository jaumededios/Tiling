name = "Tiling"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Tiling", "TranslationalTilings"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "Tiling"

[[lean_lib]]
name = "TranslationalTilings"

# The three bare module names below follow the directory convention used by
# leanprover/comparator: the trusted challenge and the submitted solution are
# compiled in separate environments, while both share `ChallengeDeps`.
[[lean_lib]]
name = "ChallengeDeps"
srcDir = "comparator/rational-polygonal"

[[lean_lib]]
name = "Challenge"
srcDir = "comparator/rational-polygonal"

[[lean_lib]]
name = "Solution"
srcDir = "comparator/rational-polygonal"
